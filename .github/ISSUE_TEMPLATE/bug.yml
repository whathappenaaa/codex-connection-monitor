name: 问题反馈 / Bug report
description: 报告可复现的问题，请勿上传账号令牌或私人日志。
body:
  - type: input
    id: versions
    attributes:
      label: 程序、Windows 和 Codex 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 分类错误或已遮挡的截图
      description: 不要上传原始日志、数据库、登录文件、Token 或私人聊天。
